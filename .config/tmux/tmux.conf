# change prefix
unbind C-b
set-option -g prefix C-a
bind C-a send-prefix

# mouse on
set -g mouse on

# split-window
unbind '"'
unbind %
bind = split-window -h
bind - split-window -v

# switch panes: Ctrl + h/j/k/l (no prefix)
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

# resize panes: prefix + h/j/k/l (repeatable)
bind -r h resize-pane -L 5
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5

# plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'vaaleyard/tmux-dotbar'

# pane title bar at top: current pane shows full path (~ style) in raspberry
set -g pane-border-status top
set -g pane-border-style 'fg=colour240'
set -g pane-active-border-style 'fg=#E30B5C'
set -g pane-border-format '#{?pane_active,#[fg=#E30B5C#,bold] #(echo "#{pane_current_path}" | sed "s|^$HOME|~|") ,#[fg=colour245] #{b:pane_current_path} }'

# dot-bar-config
set -g @tmux-dotbar-right "true"
set -g @tmux-dotbar-status-right-text " %H:%M "
set -g @tmux-dotbar-session-text "( main )"

# keep at the very bottom
run '~/.tmux/plugins/tpm/tpm'
